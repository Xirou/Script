<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="512" height="512"><style>
svg *{transform-box:fill-box;transform-origin:center}
.sw{animation:sw 4s ease-in-out infinite}@keyframes sw{0%{transform:translateX(0)}45%,100%{transform:translateX(560px)}}
.mn{animation:fl 3s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
