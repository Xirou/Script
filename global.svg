.ma{animation:rot 4s ease-in-out infinite}.mb{animation:rot 4s ease-in-out infinite;animation-delay:-2s}@keyframes rot{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.12)}}
.cur{animation:cu 2.6s ease-in-out infinite}@keyframes cu{0%,55%,100%{transform:translate(0,0)}68%{transform:translate(6px,8px)}82%{transform:translate(0,0)}}
